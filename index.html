<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معاينة HTML المتطورة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: rgba(52, 152, 219, 0.9);
            --secondary-color: rgba(41, 128, 185, 0.9);
            --accent-color: rgba(231, 76, 60, 0.9);
            --success-color: rgba(46, 204, 113, 0.9);
            --glass-effect: rgba(255, 255, 255, 0.3);
            --glass-border: rgba(255, 255, 255, 0.4);
            --glass-shadow: 0 8px 32px rgba(31, 38, 135, 0.2);
            --text-dark: #2c3e50;
            --text-light: #ecf0f1;
            --transition-speed: 0.3s;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            overflow-x: hidden;
            color: var(--text-dark);
            line-height: 1.6;
        }
        
        .glass-panel {
            background: var(--glass-effect);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            padding: 25px;
            margin: 20px;
            transition: all var(--transition-speed) ease;
        }
        
        .glass-panel:hover {
            box-shadow: 0 12px 40px rgba(31, 38, 135, 0.25);
        }
        
        .header {
            text-align: center;
            padding: 25px 0;
            position: relative;
        }
        
        .header h1 {
            font-size: 2.8rem;
            color: var(--text-dark);
            margin-bottom: 15px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.1);
            position: relative;
            display: inline-block;
        }
        
        .header h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: var(--primary-color);
            border-radius: 2px;
        }
        
        .header p {
            color: var(--text-dark);
            opacity: 0.8;
            font-size: 1.1rem;
            max-width: 700px;
            margin: 0 auto;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 50px;
            background: var(--primary-color);
            color: var(--text-light);
            cursor: pointer;
            transition: all var(--transition-speed) ease;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 1rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: all 0.6s ease;
        }
        
        .btn:hover {
            background: var(--secondary-color);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }
        
        .btn:hover::before {
            left: 100%;
        }
        
        .btn:active {
            transform: translateY(1px);
        }
        
        .btn i {
            font-size: 1.1rem;
        }
        
        .btn-danger {
            background: var(--accent-color);
        }
        
        .btn-success {
            background: var(--success-color);
        }
        
        .editor-container {
            display: flex;
            flex-direction: column;
            height: 70vh;
            transition: all var(--transition-speed) ease;
        }
        
        .editor-row {
            display: flex;
            flex: 1;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .editor-section, .preview-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: var(--primary-color);
            color: var(--text-light);
            border-radius: 15px 15px 0 0;
            margin-bottom: -1px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        
        .section-title {
            font-weight: 600;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .section-actions {
            display: flex;
            gap: 12px;
        }
        
        .action-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: var(--text-light);
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-speed) ease;
        }
        
        .action-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.1);
        }
        
        textarea.code-editor {
            flex: 1;
            padding: 20px;
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 0 0 15px 15px;
            resize: none;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 15px;
            line-height: 1.6;
            background: rgba(255,255,255,0.85);
            direction: ltr;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.05);
            transition: all var(--transition-speed) ease;
            tab-size: 4;
        }
        
        textarea.code-editor:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: inset 0 2px 15px rgba(0,0,0,0.1), 0 0 0 2px rgba(52, 152, 219, 0.2);
        }
        
        .preview-container {
            flex: 1;
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 0 0 15px 15px;
            overflow: hidden;
            background: white;
            position: relative;
        }
        
        .preview-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255,255,255,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 15px;
            opacity: 0;
            pointer-events: none;
            transition: all var(--transition-speed) ease;
            z-index: 10;
        }
        
        .preview-container:hover .preview-overlay {
            opacity: 1;
        }
        
        .preview-overlay-btn {
            padding: 10px 20px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: all var(--transition-speed) ease;
        }
        
        .preview-overlay-btn:hover {
            background: var(--secondary-color);
            transform: translateY(-2px);
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }
        
        .media-controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        
        .media-btn {
            padding: 10px 20px;
            border-radius: 50px;
            background: rgba(255,255,255,0.7);
            border: 1px solid rgba(0,0,0,0.1);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all var(--transition-speed) ease;
            font-weight: 500;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        
        .media-btn:hover {
            background: rgba(255,255,255,0.9);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }
        
        .media-btn.active {
            background: var(--primary-color);
            color: var(--text-light);
            border-color: var(--primary-color);
        }
        
        .media-btn i {
            font-size: 1.1rem;
        }
        
        .hidden {
            display: none !important;
        }
        
        .fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1000;
            margin: 0;
            border-radius: 0;
            background: white;
            animation: fadeIn 0.3s ease;
        }
        
        .fullscreen-iframe {
            height: 100vh;
        }
        
        .status-bar {
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
            background: rgba(0,0,0,0.05);
            border-radius: 0 0 15px 15px;
            font-size: 0.9rem;
            color: rgba(0,0,0,0.7);
        }
        
        .status-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .status-item i {
            font-size: 0.9rem;
        }
        
        .syntax-highlight {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 1;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .pulse {
            animation: pulse 1.5s infinite;
        }
        
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary-color);
            color: white;
            padding: 12px 25px;
            border-radius: 50px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            z-index: 2000;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            transition: all 0.3s ease;
        }
        
        .toast.show {
            opacity: 1;
            bottom: 40px;
        }
        
        @media (max-width: 992px) {
            .editor-row {
                flex-direction: column;
                height: auto;
            }
            
            .editor-section, .preview-section {
                height: 50vh;
            }
            
            .header h1 {
                font-size: 2.2rem;
            }
            
            .btn {
                padding: 10px 18px;
                font-size: 0.9rem;
            }
        }
        
        @media (max-width: 576px) {
            .glass-panel {
                margin: 10px;
                padding: 15px;
            }
            
            .header h1 {
                font-size: 1.8rem;
            }
            
            .header p {
                font-size: 1rem;
            }
            
            .controls {
                gap: 10px;
            }
            
            .btn {
                padding: 8px 15px;
                font-size: 0.8rem;
            }
            
            .section-header {
                padding: 10px 15px;
            }
            
            textarea.code-editor {
                padding: 15px;
                font-size: 14px;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="glass-panel">
        <div class="header">
            <h1><i class="fas fa-code"></i> معاينة HTML المتطورة</h1>
            <p>أداة متكاملة لمعاينة وتجربة أكواد HTML مع دعم للوسائط وتصميم عصري</p>
        </div>
        
        <div class="controls">
            <button class="btn btn-success" onclick="runCode()">

            </button>
            <button class="btn btn-danger" onclick="clearCode()">
                <i class="fas fa-trash"></i> مسح
            </button>
            <button class="btn" onclick="toggleFullscreen()" id="fullscreen-btn">

            </button>
            <button class="btn" onclick="openInNewTab()">
                <i class="fas fa-external-link-alt"></i> نافذة جديدة

            <button class="btn" onclick="toggleEditor()" id="toggle-editor-btn">

            </button>

                <i class="fas fa-save"></i> حفظ

        <div class="editor-container" id="editor-container">
            <div class="editor-row">
                <div class="editor-section glass-panel" id="editor-section">
                    <div class="section-header">
                        <span class="section-title"><i class="fas fa-edit"></i> محرر HTML</span>
                        <div class="section-actions">
                            <button class="action-btn" title="تكبير النص" onclick="zoomEditor('in')">
                                <i class="fas fa-search-plus"></i>
                            </button>
                            <button class="action-btn" title="تصغير النص" onclick="zoomEditor('out')">
                                <i class="fas fa-search-minus"></i>
                            </button>
                            <button class="action-btn" title="تنسيق الكود" onclick="formatCode()">
                                <i class="fas fa-indent"></i>
                            </button>
                        </div>
                    </div>
                    <textarea id="html-code" class="code-editor" placeholder="أدخل كود HTML هنا..."><!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحتي</title>
    <style>

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

        }

    </style>
</head>
<body>
    <div class="container">
        <h1>مرحباً بك في معاينة HTML المتطورة</h1>
        <p>هذه صفحة تجريبية يمكنك تعديلها كما تريد</p>
        <button class="btn" onclick="alert('أهلاً وسهلاً!')">انقر هنا</button>
        
        <div id="media-container" style="margin-top: 40px;">
            <!-- سيتم عرض الكاميرا والميكروفون هنا -->
        </div>

</body>
</html></textarea>
                    <div class="status-bar">
                        <div class="status-item">
                            <i class="fas fa-keyboard"></i>
                            <span id="line-count">1</span> أسطر
                        </div>
                        <div class="status-item">
                            <i class="fas fa-font"></i>
                            <span id="font-size">15px</span>
                        </div>
                        <div class="status-item">
                            <i class="fas fa-code"></i>
                            HTML
                        </div>
                    </div>
                </div>
                
                <div class="preview-section glass-panel">
                    <div class="section-header">
                        <span class="section-title"><i class="fas fa-eye"></i> معاينة</span>
                        <div class="section-actions">
                            <button class="action-btn" title="تحديث" onclick="runCode()">
                                <i class="fas fa-sync-alt"></i>
                            </button>
                            <button class="action-btn" title="إعادة تحميل" onclick="reloadPreview()">
                                <i class="fas fa-redo"></i>
                            </button>
                        </div>
                    </div>
                    <div class="preview-container" id="preview-container">
                        <div class="preview-overlay">
                            <button class="preview-overlay-btn" onclick="runCode()">
                                <i class="fas fa-sync-alt"></i> تحديث
                            </button>
                            <button class="preview-overlay-btn" onclick="toggleFullscreen()">
                                <i class="fas fa-expand"></i> ملء الشاشة
                            </button>
                        </div>
                        <iframe id="preview-frame" title="معاينة HTML"></iframe>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="media-controls">
            <button class="media-btn" onclick="toggleCamera()" id="camera-btn">
                <i class="fas fa-camera"></i> الكاميرا
            </button>
            <button class="media-btn" onclick="toggleMicrophone()" id="microphone-btn">
                <i class="fas fa-microphone"></i> الميكروفون
            </button>
            <button class="media-btn" onclick="toggleScreenshot()" id="screenshot-btn">
                <i class="fas fa-camera-retro"></i> لقطة شاشة
            </button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // متغيرات التطبيق
        let cameraActive = false;
        let microphoneActive = false;
        let stream = null;
        let editorVisible = true;
        let fontSize = 15;
        
        // عناصر DOM
        const htmlCodeEl = document.getElementById('html-code');
        const previewFrame = document.getElementById('preview-frame');
        const editorSection = document.getElementById('editor-section');
        const toggleEditorBtn = document.getElementById('toggle-editor-btn');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const previewContainer = document.getElementById('preview-container');
        const cameraBtn = document.getElementById('camera-btn');
        const microphoneBtn = document.getElementById('microphone-btn');
        const lineCountEl = document.getElementById('line-count');
        const fontSizeEl = document.getElementById('font-size');
        const toastEl = document.getElementById('toast');
        
        // تهيئة المحرر
        function initEditor() {
            // تحديث عدد الأسطر عند الكتابة
            htmlCodeEl.addEventListener('input', updateLineCount);
            
            // اختصارات لوحة المفاتيح
            htmlCodeEl.addEventListener('keydown', function(e) {
                if (e.key === 'Tab') {
                    e.preventDefault();
                    const start = this.selectionStart;
                    const end = this.selectionEnd;
                    
                    this.value = this.value.substring(0, start) + '    ' + this.value.substring(end);
                    this.selectionStart = this.selectionEnd = start + 4;
                    
                    updateLineCount();
                }
                
                // حفظ مع Ctrl+S / Cmd+S
                if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                    e.preventDefault();
                    saveCode();
                }
                
                // تشغيل الكود مع F5
                if (e.key === 'F5') {
                    e.preventDefault();
                    runCode();
                }
            });
            
            updateLineCount();
            runCode();
        }
        
        // تحديث عدد الأسطر
        function updateLineCount() {
            const lines = htmlCodeEl.value.split('\n').length;
            lineCountEl.textContent = lines;
        }
        
        // تشغيل الكود وعرضه في الإطار
        function runCode() {
            try {
                const htmlCode = htmlCodeEl.value;
                const previewDocument = previewFrame.contentDocument || previewFrame.contentWindow.document;
                
                previewDocument.open();
                previewDocument.write(htmlCode);
                previewDocument.close();
                
                // إعادة تشغيل الوسائط إذا كانت نشطة
                if (cameraActive || microphoneActive) {
                    setTimeout(() => {
                        const mediaContainer = previewDocument.getElementById('media-container');
                        if (mediaContainer) {
                            if (cameraActive) startCamera(mediaContainer);
                            if (microphoneActive) startMicrophone(mediaContainer);
                        }
                    }, 300);
                }
                
                showToast('تم تشغيل الكود بنجاح', 'success');
            } catch (error) {
                console.error('Error running code:', error);
                showToast('حدث خطأ في تشغيل الكود', 'error');
            }
        }
        
        // مسح المحرر
        function clearCode() {
            if (confirm('هل أنت متأكد من أنك تريد مسح الكود؟ سيتم فقدان جميع التغييرات.')) {
                htmlCodeEl.value = '';
                const previewDocument = previewFrame.contentDocument || previewFrame.contentWindow.document;
                
                previewDocument.open();
                previewDocument.write('');
                previewDocument.close();
                
                stopMedia();
                updateLineCount();
                showToast('تم مسح الكود', 'info');
            }
        }
        
        // تبديل عرض المحرر
        function toggleEditor() {
            editorVisible = !editorVisible;
            editorSection.classList.toggle('hidden');
            
            if (editorVisible) {
                toggleEditorBtn.innerHTML = '<i class="fas fa-eye-slash"></i> إخفاء المحرر';
            } else {
                toggleEditorBtn.innerHTML = '<i class="fas fa-eye"></i> إظهار المحرر';
            }
        }
        
        // عرض المعاينة في نافذة جديدة
        function openInNewTab() {
            const htmlCode = htmlCodeEl.value;
            const newWindow = window.open('', '_blank');
            
            try {
                newWindow.document.open();
                newWindow.document.write(htmlCode);
                newWindow.document.close();
                showToast('تم فتح الكود في نافذة جديدة', 'success');
            } catch (error) {
                console.error('Error opening new tab:', error);
                showToast('حدث خطأ في فتح النافذة الجديدة', 'error');
            }
        }
        
        // عرض/إخفاء وضع ملء الشاشة
        function toggleFullscreen() {
            previewContainer.classList.toggle('fullscreen');
            
            if (previewContainer.classList.contains('fullscreen')) {
                fullscreenBtn.innerHTML = '<i class="fas fa-compress"></i> تصغير';
                showToast('وضع ملء الشاشة مفعل', 'info');
            } else {
                fullscreenBtn.innerHTML = '<i class="fas fa-expand"></i> ملء الشاشة';
            }
        }
        
        // إعادة تحميل المعاينة
        function reloadPreview() {
            const previewDocument = previewFrame.contentDocument || previewFrame.contentWindow.document;
            previewDocument.location.reload();
            showToast('تم إعادة تحميل المعاينة', 'info');
        }
        
        // تكبير/تصغير نص المحرر
        function zoomEditor(type) {
            if (type === 'in' && fontSize < 24) {
                fontSize += 2;
            } else if (type === 'out' && fontSize > 12) {
                fontSize -= 2;
            }
            
            htmlCodeEl.style.fontSize = fontSize + 'px';
            fontSizeEl.textContent = fontSize + 'px';
        }
        
        // تنسيق الكود
        function formatCode() {
            try {
                const formattedCode = htmlCodeEl.value
                    .replace(/></g, '>\n<')
                    .replace(/\n\n+/g, '\n')
                    .replace(/^\s+/gm, '');
                
                htmlCodeEl.value = formattedCode;
                updateLineCount();
                showToast('تم تنسيق الكود', 'success');
            } catch (error) {
                console.error('Error formatting code:', error);
                showToast('حدث خطأ في تنسيق الكود', 'error');
            }
        }
        
        // حفظ الكود
        function saveCode() {
            const blob = new Blob([htmlCodeEl.value], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            
            a.href = url;
            a.download = 'code.html';
            a.click();
            
            URL.revokeObjectURL(url);
            showToast('تم حفظ الملف', 'success');
        }
        
        // إظهار التنبيهات
        function showToast(message, type) {
            toastEl.textContent = message;
            toastEl.innerHTML = `<i class="fas fa-${type === 'error' ? 'times-circle' : type === 'success' ? 'check-circle' : 'info-circle'}"></i> ${message}`;
            toastEl.style.background = type === 'error' ? 'var(--accent-color)' : type === 'success' ? 'var(--success-color)' : 'var(--primary-color)';
            
            toastEl.classList.add('show');
            
            setTimeout(() => {
                toastEl.classList.remove('show');
            }, 3000);
        }
        
        // إدارة الكاميرا والميكروفون
        async function toggleCamera() {
            try {
                if (!cameraActive) {
                    const previewDocument = previewFrame.contentDocument || previewFrame.contentWindow.document;
                    const mediaContainer = previewDocument.getElementById('media-container');
                    
                    if (mediaContainer) {
                        await startCamera(mediaContainer);
                        cameraBtn.classList.add('active');
                        cameraActive = true;
                        showToast('تم تشغيل الكاميرا', 'success');
                    } else {
                        showToast('لا يوجد عنصر لاستضافة الكاميرا', 'error');
                    }
                } else {
                    stopCamera();
                    cameraBtn.classList.remove('active');
                    cameraActive = false;
                    showToast('تم إيقاف الكاميرا', 'info');
                }
            } catch (error) {
                console.error('Camera error:', error);
                showToast('تعذر الوصول إلى الكاميرا', 'error');
            }
        }
        
        async function toggleMicrophone() {
            try {
                if (!microphoneActive) {
                    const previewDocument = previewFrame.contentDocument || previewFrame.contentWindow.document;
                    const mediaContainer = previewDocument.getElementById('media-container');
                    
                    if (mediaContainer) {
                        await startMicrophone(mediaContainer);
                        microphoneBtn.classList.add('active');
                        microphoneActive = true;
                        showToast('تم تشغيل الميكروفون', 'success');
                    } else {
                        showToast('لا يوجد عنصر لاستضافة الميكروفون', 'error');
                    }
                } else {
                    stopMicrophone();
                    microphoneBtn.classList.remove('active');
                    microphoneActive = false;
                    showToast('تم إيقاف الميكروفون', 'info');
                }
            } catch (error) {
                console.error('Microphone error:', error);
                showToast('تعذر الوصول إلى الميكروفون', 'error');
            }
        }
        
        async function toggleScreenshot() {
            try {
                const previewDocument = previewFrame.contentDocument || previewFrame.contentWindow.document;
                await html2canvas(previewDocument.body).then(canvas => {
                    const link = document.createElement('a');
                    link.download = 'screenshot.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                });
                showToast('تم حفظ لقطة الشاشة', 'success');
            } catch (error) {
                console.error('Screenshot error:', error);
                showToast('تعذر أخذ لقطة الشاشة', 'error');
            }
        }
        
        async function startCamera(container) {
            stopMedia();
            
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const video = document.createElement('video');
                video.srcObject = stream;
                video.autoplay = true;
                video.style.width = '100%';
                video.style.borderRadius = '10px';
                video.style.marginTop = '20px';
                video.style.boxShadow = '0 4px 15px rgba(0,0,0,0.1)';
                
                container.innerHTML = '<h3 style="color: #3498db; margin-bottom: 10px;">الكاميرا النشطة:</h3>';
                container.appendChild(video);
            } catch (error) {
                throw error;
            }
        }
        
        async function startMicrophone(container) {
            stopMedia();
            
            try {
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const analyser = audioContext.createAnalyser();
                const microphone = audioContext.createMediaStreamSource(stream);
                microphone.connect(analyser);
                
                const canvas = document.createElement('canvas');
                canvas.width = 600;
                canvas.height = 120;
                canvas.style.width = '100%';
                canvas.style.backgroundColor = '#f8f9fa';
                canvas.style.borderRadius = '10px';
                canvas.style.marginTop = '20px';
                canvas.style.boxShadow = '0 4px 15px rgba(0,0,0,0.1)';
                
                const canvasCtx = canvas.getContext('2d');
                
                container.innerHTML = '<h3 style="color: #3498db; margin-bottom: 10px;">الميكروفون النشط:</h3>';
                container.appendChild(canvas);
                
                function visualize() {
                    if (!microphoneActive) return;
                    
                    requestAnimationFrame(visualize);
                    
                    const bufferLength = analyser.frequencyBinCount;
                    const dataArray = new Uint8Array(bufferLength);
                    analyser.getByteTimeDomainData(dataArray);
                    
                    canvasCtx.fillStyle = '#f8f9fa';
                    canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    canvasCtx.lineWidth = 2;
                    canvasCtx.strokeStyle = '#3498db';
                    canvasCtx.beginPath();
                    
                    const sliceWidth = canvas.width * 1.0 / bufferLength;
                    let x = 0;
                    
                    for (let i = 0; i < bufferLength; i++) {
                        const v = dataArray[i] / 128.0;
                        const y = v * canvas.height / 2;
                        
                        if (i === 0) {
                            canvasCtx.moveTo(x, y);
                        } else {
                            canvasCtx.lineTo(x, y);
                        }
                        
                        x += sliceWidth;
                    }
                    
                    canvasCtx.lineTo(canvas.width, canvas.height / 2);
                    canvasCtx.stroke();
                }
                
                visualize();
            } catch (error) {
                throw error;
            }
        }
        
        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.kind === 'video' && track.stop());
            }
        }
        
        function stopMicrophone() {
            if (stream) {
                stream.getTracks().forEach(track => track.kind === 'audio' && track.stop());
            }
        }
        
        function stopMedia() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
        }
        
        // تهيئة التطبيق عند التحميل
        window.addEventListener('DOMContentLoaded', initEditor);
        
        // إيقاف الوسائط عند إغلاق الصفحة
        window.addEventListener('beforeunload', stopMedia);
    </script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</body>
